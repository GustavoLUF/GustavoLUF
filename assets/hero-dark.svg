<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc">
  <title id="title">Gustavo Lopes — Python Backend Developer</title>
  <desc id="desc">A dark banner with a softly animated data signal moving between API, data, and machine learning nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1522"/><stop offset="1" stop-color="#101F2B"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#43D6C4"/><stop offset="1" stop-color="#68C6E8"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#1C3440" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .signal { animation: travel 3.8s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.8s ease-in-out infinite; }
      @keyframes travel { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -36; } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { .signal, .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="1200" height="310" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="308" rx="23" fill="url(#grid)" stroke="#25414B"/>
  <circle cx="1065" cy="147" r="148" fill="#143B3C" opacity=".52"/>
  <circle cx="1096" cy="25" r="64" fill="#123443" opacity=".45"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="72" y="77" fill="#50D6C2" font-size="14" font-weight="700" letter-spacing="3">BACKEND ENGINEERING  /  DATA SCIENCE</text>
    <text x="68" y="151" fill="#F0F6F4" font-size="54" font-weight="700" letter-spacing="-1.5">Gustavo Lopes</text>
    <text x="72" y="195" fill="#B6CAC8" font-size="21">Python APIs, backend systems &amp; machine learning</text>
    <g transform="translate(72 230)">
      <rect width="118" height="34" rx="17" fill="#123D3A"/>
      <circle cx="17" cy="17" r="5" fill="#43D6C4"/>
      <text x="30" y="22" fill="#BCECE3" font-size="13" font-weight="700" letter-spacing="1">PYTHON</text>
      <rect x="128" width="118" height="34" rx="17" fill="#183344"/>
      <circle cx="145" cy="17" r="5" fill="#68C6E8"/>
      <text x="158" y="22" fill="#C5E1E9" font-size="13" font-weight="700" letter-spacing="1">BACKEND</text>
      <rect x="256" width="102" height="34" rx="17" fill="#3B3025"/>
      <circle cx="273" cy="17" r="5" fill="#E7AA67"/>
      <text x="286" y="22" fill="#F1D6B7" font-size="13" font-weight="700" letter-spacing="1">DATA / ML</text>
    </g>
  </g>
  <g transform="translate(708 70)" font-family="Segoe UI, Arial, sans-serif">
    <path d="M88 65H180M248 65H338" stroke="#35535C" stroke-width="3"/>
    <path class="signal" d="M88 65H338" fill="none" stroke="url(#accent)" stroke-width="3" stroke-dasharray="5 13"/>
    <circle class="pulse" cx="88" cy="65" r="39" fill="#123D3A" stroke="#43D6C4" stroke-width="2"/>
    <circle class="pulse" cx="214" cy="65" r="39" fill="#183344" stroke="#68C6E8" stroke-width="2" style="animation-delay:.4s"/>
    <circle class="pulse" cx="338" cy="65" r="39" fill="#3B3025" stroke="#E7AA67" stroke-width="2" style="animation-delay:.8s"/>
    <circle cx="88" cy="65" r="7" fill="#43D6C4" filter="url(#glow)"/>
    <path d="M205 55h18v20h-18zM209 50h10v5h-10zM209 60h10M209 66h10" fill="none" stroke="#68C6E8" stroke-width="2" stroke-linecap="round"/>
    <path d="M327 71c0-8 5-13 11-13s11 5 11 13M338 52v8M326 66l-5-4M350 66l5-4" fill="none" stroke="#E7AA67" stroke-width="2" stroke-linecap="round"/>
    <text x="88" y="129" text-anchor="middle" fill="#B6CAC8" font-size="13" font-weight="700" letter-spacing="1">API</text>
    <text x="214" y="129" text-anchor="middle" fill="#B6CAC8" font-size="13" font-weight="700" letter-spacing="1">DATA</text>
    <text x="338" y="129" text-anchor="middle" fill="#B6CAC8" font-size="13" font-weight="700" letter-spacing="1">ML</text>
    <text x="214" y="183" text-anchor="middle" fill="#78989A" font-size="12" letter-spacing="2">FROM REQUEST TO INSIGHT</text>
  </g>
</svg>
